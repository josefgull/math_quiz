name: Deploy Web Quiz

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Builds the menu from the questions/ folder; fails if a question file is broken
      - name: Build menu
        run: python3 build_menu.py

      - name: Collect site files
        run: |
          mkdir site
          cp index.html quiz.jsx questions.json site/
          cp -r assets site/

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
