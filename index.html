<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math Quiz</title>
    <link rel="icon" type="image/png" href="./assets/icon/app_icon.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css" />
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>
  </head>
  <body style="background: #14232b">
    <div id="root"></div>
    <script type="module">
      // Fetches quiz.jsx, strips only the JSX syntax with Babel (import/export
      // stay native ES module syntax), then loads the result as a real module
      // so "react" resolves via the import map above.
      try {
        const res = await fetch("./quiz.jsx");
        const source = await res.text();
        const { code } = Babel.transform(source, {
          presets: [["react", { runtime: "automatic" }]],
          filename: "quiz.jsx",
        });
        const blob = new Blob([code], { type: "text/javascript" });
        const { default: MathQuiz } = await import(URL.createObjectURL(blob));

        const React = await import("react");
        const { createRoot } = await import("react-dom/client");
        createRoot(document.getElementById("root")).render(React.createElement(MathQuiz));
      } catch (err) {
        console.error(err);
        document.getElementById("root").innerHTML =
          `<pre style="color:#f0dcdc;padding:1rem;white-space:pre-wrap;">${err.stack || err}</pre>`;
      }
    </script>
  </body>
</html>
